<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voya Oracle | Твоя судьба</title>
    <meta name="theme-color" content="#0a0515">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Иконка-звезда -->
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48ZGVmcz48cmFkaWFsR3JhZGllbnQgaWQ9ImciPjxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29sb3I9IiNmZmYiLz48c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiM4YjVjZjYiLz48L3JhZGlhbEdyYWRpZW50PjwvZGVmcz48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjQwIiBmaWxsPSIjMGEwNTE1Ii8+PHBvbHlnb24gcG9pbnRzPSI5NiwyMCAxMTAsODAgMTcwLDgwIDEyMCwxMTAgMTQwLDE3MCA5NiwxMzAgNTIsMTcwIDcyLDExMCAyMiw4MCA4Miw4MCIgZmlsbD0idXJsKCNnKSIvPjwvc3ZnPg==">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        
        body {
            background: #05020a;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Звездный фон */
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* ЗАСТАВКА */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #2a1050 0%, #05020a 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.8s ease;
        }

        .splash-logo {
            font-size: 3rem; font-weight: 900; letter-spacing: 4px;
            background: linear-gradient(90deg, #a78bfa, #f472b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.4); margin-bottom: 10px;
        }
        
        .splash-sub { color: #a78bfa; font-size: 0.9rem; letter-spacing: 2px; margin-bottom: 40px; }

        .enter-btn {
            padding: 16px 40px; background: linear-gradient(90deg, #8b5cf6, #ec4899);
            color: #fff; border: none; border-radius: 30px; font-size: 1.1rem; font-weight: 800;
            cursor: pointer; box-shadow: 0 10px 30px rgba(139, 92, 246, 0.5); text-transform: uppercase;
            transition: 0.3s;
        }
        .enter-btn:active { transform: scale(0.95); }

        /* ОСНОВНОЕ ПРИЛОЖЕНИЕ */
        #app {
            display: none; width: 100%; max-width: 450px; padding: 20px;
            background: rgba(20, 10, 35, 0.85); backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 24px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8); z-index: 10; position: relative;
            max-height: 95vh; overflow-y: auto;
        }

        h1 { font-size: 1.8rem; font-weight: 900; background: linear-gradient(90deg, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        p.sub { font-size: 0.8rem; color: #a78bfa; margin-bottom: 20px; letter-spacing: 1px; }

        /* Анимация шара */
        .ball-container { position: relative; width: 120px; height: 120px; margin: 0 auto 20px; }
        .crystal-ball {
            width: 100%; height: 100%; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(139, 92, 246, 0.6) 40%, rgba(10, 5, 21, 1) 80%);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.8), inset 0 0 20px rgba(255,255,255,0.6);
            animation: pulse 2s infinite alternate;
        }
        .ring { position: absolute; top: 50%; left: 50%; border-radius: 50%; border: 1px dashed #ec4899; animation: spin 10s linear infinite; }
        .ring-1 { width: 160px; height: 160px; margin: -80px 0 0 -80px; }
        .ring-2 { width: 200px; height: 200px; margin: -100px 0 0 -100px; border: 1px solid #a78bfa; animation-direction: reverse; animation-duration: 15s; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); } 100% { transform: scale(1.05); box-shadow: 0 0 50px rgba(139, 92, 246, 0.9); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Категории */
        .categories { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .cat-btn {
            flex: 1; padding: 12px 5px; background: rgba(0,0,0,0.5); border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 10px; color: #a78bfa; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .cat-btn.active { background: rgba(139, 92, 246, 0.2); border-color: #a78bfa; color: #fff; box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }

        input { width: 100%; padding: 14px; border-radius: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(139, 92, 246, 0.4); color: #fff; text-align: center; outline: none; margin-bottom: 15px; font-size: 1rem; }
        input:focus { border-color: #f472b6; }

        .main-btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            background: linear-gradient(90deg, #8b5cf6, #ec4899); color: #fff; font-weight: 800; font-size: 1rem;
            cursor: pointer; transition: 0.3s; box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4); text-transform: uppercase;
        }
        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #resultBox { display: none; margin-top: 20px; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 15px; border-left: 4px solid #f472b6; text-align: left; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #predictionText { font-size: 0.95rem; line-height: 1.6; color: #e2e8f0; }
        
        .btn-share { margin-top: 15px; background: transparent; border: 1px solid #ec4899; color: #ec4899; box-shadow: none; font-size: 0.9rem; padding: 12px; display: none; }
        .btn-share:hover { background: rgba(236, 72, 153, 0.1); box-shadow: none; }

        /* Кнопка музыки */
        .music-btn {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); 
            border: 1px solid #a78bfa; color: #a78bfa; width: 40px; height: 40px; 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 20;
        }
    </style>
</head>
<body>

    <!-- Звездный фон -->
    <canvas id="stars"></canvas>

    <!-- Фоновая музыка -->
    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_27b275bc4b.mp3?filename=dark-ambient-114468.mp3" type="audio/mpeg">
    </audio>

    <!-- ЗАСТАВКА -->
    <div id="splash-screen">
        <div class="splash-logo">VOYA ORACLE</div>
        <div class="splash-sub">ПРИОТКРОЙ ЗАВЕСУ ТАЙНЫ</div>
        <button class="enter-btn" onclick="startApp()">Войти</button>
    </div>

    <!-- ПРИЛОЖЕНИЕ -->
    <div id="app">
        <div class="music-btn" id="musicToggle" onclick="toggleMusic()">🎵</div>
        
        <h1>ОРАКУЛ</h1>
        <p class="sub">Задай вопрос Вселенной</p>

        <div class="ball-container">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="crystal-ball"></div>
        </div>

        <div class="categories">
            <div class="cat-btn active" onclick="setCategory('love', this)">❤️ Любовь</div>
            <div class="cat-btn" onclick="setCategory('money', this)">💰 Деньги</div>
            <div class="cat-btn" onclick="setCategory('fate', this)">🔮 Судьба</div>
        </div>

        <input type="text" id="userName" placeholder="Введи свое имя..." autocomplete="off">
        
        <button class="main-btn" id="askBtn" onclick="getPrediction()">Узнать предсказание</button>

        <div id="resultBox">
            <p id="predictionText"></p>
            <button class="main-btn btn-share" id="shareBtn" onclick="sharePrediction()">📲 Поделиться в Stories</button>
        </div>
    </div>

    <script>
        // 1. ЗВЕЗДНЫЙ ФОН
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let w, h, stars = [];

        function initStars() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    radius: Math.random() * 1.5,
                    speed: Math.random() * 0.5 + 0.1,
                    alpha: Math.random()
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, w, h);
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.fill();
                s.y -= s.speed;
                if (s.y < 0) { s.y = h; s.x = Math.random() * w; }
            });
            requestAnimationFrame(drawStars);
        }

        initStars();
        drawStars();
        window.addEventListener('resize', initStars);

        // 2. ЛОГИКА
        let currentCategory = 'love';
        let isMusicPlaying = false;

        function startApp() {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            
            const music = document.getElementById('bgMusic');
            music.volume = 0.3;
            music.play().catch(e => console.log("Музыка заблокирована"));
            isMusicPlaying = true;

            setTimeout(() => { 
                splash.style.display = 'none'; 
                document.getElementById('app').style.display = 'block'; 
            }, 800);
        }

        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('musicToggle');
            if (isMusicPlaying) {
                music.pause();
                btn.innerText = '🔇';
                isMusicPlaying = false;
            } else {
                music.play();
                btn.innerText = '🎵';
                isMusicPlaying = true;
            }
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function playVoice(text) {
            let cleanText = text.replace(/[*#\n]/g, ' ').replace(/\s+/g, ' ').trim();
            if (cleanText.length > 190) cleanText = cleanText.substring(0, 190) + "...";
            
            const url = `https://api.streamelements.com/kappa/v2/speech?voice=ru-RU-Wavenet-A&text=${encodeURIComponent(cleanText)}`;
            const audio = new Audio(url);
            
            audio.play().catch(e => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utt = new SpeechSynthesisUtterance(cleanText);
                    utt.lang = 'ru-RU';
                    utt.pitch = 0.8; 
                    utt.rate = 0.9;  
                    window.speechSynthesis.speak(utt);
                }
            });
        }

        async function getPrediction() {
            const nameInput = document.getElementById('userName').value.trim();
            const name = nameInput || "Странник";
            const btn = document.getElementById('askBtn');
            const resultBox = document.getElementById('resultBox');
            const textEl = document.getElementById('predictionText');
            const shareBtn = document.getElementById('shareBtn');

            btn.disabled = true;
            btn.innerText = "Космос думает...";
            resultBox.style.display = "none";
            shareBtn.style.display = "none";

            let catPrompt = "";
            if (currentCategory === 'love') catPrompt = "про любовь, отношения и чувства";
            else if (currentCategory === 'money') catPrompt = "про финансы, карьеру и успех";
            else catPrompt = "про жизненный путь и предназначение";

            let randomSeed = Math.floor(Math.random() * 1000);
            let randomWord = ["звезды", "тайна", "энергия", "вселенная", "путь", "огонь"][Math.floor(Math.random() * 6)];
            
            let prompt = `Ты - древний мистический Оракул. Твой ответ должен звучать как пророчество. 
            Дай короткое (до 35 слов) предсказание ${catPrompt} для человека по имени ${name}. 
            Обязательно используй слово "${randomWord}". Сделай текст глубоким. (Случайный код: ${randomSeed})`;

            try {
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                let answer = await response.text();

                if (answer.includes("Free limit") || answer.includes("API") || answer.includes("error")) {
                    textEl.innerHTML = "Космос перегружен. Подожди 45 секунд и попробуй снова.";
                    resultBox.style.display = "block";
                    btn.disabled = false;
                    btn.innerText = "Повторить";
                    return;
                }

                textEl.innerHTML = answer.replace(/\*\*(.*?)\*\*/g, '<b style="color:#fff; text-shadow:0 0 5px #a78bfa;">$1</b>');
                
                resultBox.style.display = "block";
                shareBtn.style.display = "block";
                
                playVoice(answer);
                
                btn.disabled = false;
                btn.innerText = "Спросить снова";
            } catch (e) {
                textEl.innerText = "Ошибка связи. Проверьте интернет.";
                resultBox.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Повторить";
            }
        }

        function sharePrediction() {
            const text = document.getElementById('predictionText').innerText;
            const shareData = {
                title: 'Мое предсказание от Voya',
                text: `🌌 Мое предсказание:\n\n"${text}"\n\nУзнай свою судьбу в Voya Oracle!`,
            };

            if (navigator.share) {
                navigator.share(shareData).catch(console.error);
            } else {
                navigator.clipboard.writeText(shareData.text).then(() => {
                    alert('Текст скопирован! Вставь его в сторис.');
                });
            }
        }
    </script>
</body>
</html>
